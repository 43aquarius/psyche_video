<body>
<div id="stage">
  <div id="bgGrid"></div>
  <div id="bgGlow"></div>

  <div id="noise"></div>

<script>
/* ================= 工具函数 ================= */
const $ = (s,p=document)=>p.querySelector(s);
const $$ = (s,p=document)=>[...p.querySelectorAll(s)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
/* 0..1 进度：进入保持型 easeOutExpo（快进慢停，全程 0.25s 量级） */
const eo = t=>{ t=clamp(t,0,1); return t>=1?1:1-Math.pow(2,-10*t); };
const ei = t=>{ t=clamp(t,0,1); return t===0?0:t===1?1:Math.pow(2,10*(t-10)); };
const easeInOut = t=>{ t=clamp(t,0,1); return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; };
/* 带持续时间的归一化进入进度：t 秒 / dur 秒 → 0..1（eo 曲线） */
const IN = (t,dur,delay=0)=>eo((t-delay)/Math.max(dur,.0001));
const LIN = (t,dur,delay=0)=>clamp((t-delay)/Math.max(dur,.0001),0,1);
/* 确定性伪随机（粒子用） */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }

/* glitch 强度：场景头 0.4s 高强度 → 衰减为微抖 */
function glitchAmp(t){ if(t<.38) return 1-(t/.38)*.75; return .25+.06*Math.sin(t*9.2); }

/* 应用 glitch：el 为 .glitch/.glitchHard，t 场景内秒 */
function applyGlitch(el,t){ const g=glitchAmp(t);
  const a=(9+7*g), b=(4+3*g);
  el.style.textShadow=`${(a*.9).toFixed(1)}px ${(b*.9).toFixed(1)}px 0 rgba(255,70,85,${.55+.4*g}), ${(-a*.9).toFixed(1)}px ${(-b*.9).toFixed(1)}px 0 rgba(79,163,241,${.55+.4*g}), 0 0 ${(30*g).toFixed(0)}px rgba(79,163,241,${.3*g})`;
  el.style.transform = g>.7 ? `translate(${(Math.sin(t*47)*3*g).toFixed(1)}px,${(Math.cos(t*61)*2*g).toFixed(1)}px)` : 'none';
}

/* 数字滚动文本 */
function fmtNum(v,dec=0){ return v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }

/* 场景创建助手 */
function mk(html){ const d=document.createElement('div'); d.className='scene'; d.innerHTML=html; $('#stage').insertBefore(d,$('#noise')); return d; }

/* 布局常量 */
const CX=960, CY=540;

/* ================= 场景注册表 ================= */
const SCENES=[]; // {el, t0, dur, render(t)}
function reg(html,dur,renderFn){ const el=mk(html); el.classList.remove('on');
  SCENES.push({el,dur,render:renderFn}); return el; }

/* 入场动画快捷应用 */
function popIn(el,t,delay=0,dur=.25,fromY=46){ const p=IN(t,dur,delay);
  el.style.opacity=p; el.style.transform=`translateY(${lerp(fromY,0,p)}px) scale(${lerp(.96,1,p)})`; }
function slideLIn(el,t,delay=0,dur=.25){ const p=IN(t,dur,delay);
  el.style.opacity=p; el.style.transform=`translateX(${lerp(-70,0,p)}px)`; }
function slideRIn(el,t,delay=0,dur=.25){ const p=IN(t,dur,delay);
  el.style.opacity=p; el.style.transform=`translateX(${lerp(70,0,p)}px)`; }
function zoomInEl(el,t,delay=0,dur=.3){ const p=IN(t,dur,delay);
  el.style.opacity=p; el.style.transform=`scale(${lerp(.55,1,p)})`; }
function wipeEl(el,t,delay=0,dur=.3){ const p=LIN(t,dur,delay);
  el.style.clipPath=`inset(0 ${(100-p*100).toFixed(1)}% 0 0)`; }

/* 粒子云初始化：返回 DOM 数组 */
function seedParticles(container,n,opt){
  const rnd=mulberry32(opt.seed||42); const els=[];
  for(let i=0;i<n;i++){
    const p=document.createElement('div'); p.className='pt';
    const size=lerp(opt.minR||3,opt.maxR||9,rnd());
    p.style.width=size+'px'; p.style.height=size+'px';
    p.style.background=opt.colors[i%opt.colors.length];
    p.style.left=(rnd()*100)+'%'; p.style.top=(rnd()*100)+'%';
    container.appendChild(p); els.push(p);
  }
  return els;
}
/* 布朗运动：确定性更新粒子位置（t 秒，speed 越大越乱） */
function brownian(els,t,speed=1,seed=42){
  const rnd=mulberry32(seed);
  els.forEach((p,i)=>{
    const ph1=rnd()*Math.PI*2, ph2=rnd()*Math.PI*2, f1=.4+rnd()*.8, f2=.4+rnd()*.8;
    const x=50+Math.sin(t*f1*speed+ph1)*38*(1+speed*.12);
    const y=50+Math.cos(t*f2*speed+ph2)*34*(1+speed*.12);
    p.style.left=x+'%'; p.style.top=y+'%';
    p.style.opacity=.25+.5*Math.abs(Math.sin(t*1.7+ph1));
  });
}
</script>

  const pulse=1+.035*Math.sin(t*4.2);
  b.style.transform=`scale(${(p*pulse).toFixed(4)})`;
  el.querySelectorAll('[data-rows] .chip').forEach((c,i)=>popIn(c,t,1.6+i*.25,.22));
});

/* ---- S38 | 137.0–147.0 | 片尾 ---- */
reg(`
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
    <div data-logo class="endLogo">
      <div class="ring"></div>
      <div>
        <div style="font-size:64px;font-weight:900;" data-t1>心理熵</div>
        <div class="enTag" data-t2 style="font-size:30px;margin-top:8px;">Psychic Entropy · Ep.01</div>
      </div>
    </div>
  </div>
  <div style="position:absolute;top:820px;left:0;right:0;text-align:center;">
    <div data-cr style="font-size:26px;color:rgba(245,246,250,.4);">内容基于 Csikszentmihalyi 的意识研究与积极心理学文献</div>
  </div>
`,10.0,(el,t)=>{
  const l=el.querySelector('[data-logo]');
  const p=eo(LIN(t,.8,.2)); l.style.opacity=p; l.style.transform=`scale(${lerp(.8,1,p)})`;
  const fadeOut=clamp((t-7.5)/2.0,0,1); // 最后 2.5s 渐隐
  el.style.opacity=1-fadeOut;
});

/* ================= 全局驱动器 ================= */
const TOTAL=147;
let _acc=0; SCENES.forEach(s=>{ s.t0=_acc; _acc+=s.dur; });
const TOTAL_SCENES=_acc;

window.seek=function(time){
  time=clamp(time,0,TOTAL);
  let cur=SCENES[0], curT=0, acc=0, activeIdx=0;
  for(let i=0;i<SCENES.length;i++){
    if(time>=acc && time<acc+SCENES[i].dur){ cur=SCENES[i]; curT=time-acc; activeIdx=i; break; }
    acc+=SCENES[i].dur;
    if(i===SCENES.length-1){ cur=SCENES[i]; curT=SCENES[i].dur; activeIdx=i; }
  }
  SCENES.forEach((s,i)=>{ s.el.classList.toggle('on', i===activeIdx); });
  cur.render(cur.el,curT);
  /* 进度条 */
  const pct=time/TOTAL;
  $('#progressFill').style.width=(pct*100)+'%';
  $('#pctNum').textContent=Math.floor(pct*100);
  /* 底部进度条在片尾渐隐 */
  const endFade=clamp((time-136)/2,0,1);
  $('#progressWrap').style.opacity=1-endFade*.9;
  $('#progressPct').style.opacity=1-endFade;
};
window.TOTAL_DURATION=TOTAL;
window.SCENE_COUNT=SCENES.length;
window.SCENE_TIMES=SCENES.map(s=>+s.t0.toFixed(4));
window.SCENE_DYNAMIC=SCENES.map(s=>!!s.el.querySelector('[data-particles]'));
console.log('Registered scenes:',SCENES.length,'total:',_acc.toFixed(2),'s');
</script>
